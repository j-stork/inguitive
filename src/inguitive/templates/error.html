<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>500 - Internal Server Error</title>
        <!-- HTMX -->
        <script src="https://unpkg.com/htmx.org@1.9.6"></script>
        <!-- Tailwind CSS -->
        <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
        <!-- Inter Font -->
        <link rel="stylesheet" href="https://rsms.me/inter/inter.css" />
        <!-- Configure Tailwind to use Inter as default sans-serif -->
        <style type="text/tailwindcss">
            @theme {
                --font-sans: Inter, sans-serif;
            }
        </style>
    </head>
    <body class="min-h-screen">
        <div class="min-h-screen flex items-center justify-center bg-gray-50 py-12 px-4 sm:px-6 lg:px-8">
            <div class="max-w-md w-full space-y-8">
                <div class="text-center">
                    <h1 class="text-4xl font-bold text-red-600">500</h1>
                    <h2 class="mt-2 text-2xl font-bold text-gray-900">Internal Server Error</h2>
                    
                    {% if dev_mode %}
                    <div class="mt-6 p-4 bg-red-50 border border-red-200 rounded-md">
                        <h3 class="text-sm font-medium text-red-800 mb-2">Request Details:</h3>
                        <p class="text-sm text-red-700">
                            <span class="font-medium">Method:</span> {{ request_method }}
                            <br>
                            <span class="font-medium">URL:</span> {{ request_url }}
                        </p>
                    </div>
                    
                    <div class="mt-6">
                        <h3 class="text-sm font-medium text-gray-700 mb-2">Traceback:</h3>
                        <pre class="bg-gray-900 text-gray-100 text-xs p-4 rounded-md overflow-x-auto max-h-96">{{ traceback }}</pre>
                    </div>
                    {% else %}
                    <p class="mt-4 text-gray-500">
                        An unexpected error occurred. Please try again later.
                    </p>
                    {% endif %}
                </div>
            </div>
        </div>
        <!-- Dummy target for HTMX POST requests -->
        <div id="hx-target" style="display: none;"></div>
    </body>
</html>
